name: Pylint

on: [push]

env:
  # The code that replaced the old NGT*.py scripts: the library and the Airflow DAGs.
  # Tool settings live in pyproject.toml (pylint, isort) and .flake8.
  LINT_TARGETS: ngt_calibration_loop airflow_automation

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]  # requires-python >= 3.10
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest black isort flake8
    - name: Analysing the code with pylint
      run: |
        pylint $LINT_TARGETS
    - name: Check import order with isort
      run: |
        isort --check-only $LINT_TARGETS
    - name: Run flake8
      run: |
        flake8 $LINT_TARGETS
