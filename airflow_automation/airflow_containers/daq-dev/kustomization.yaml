# ../onepod as it runs on CMS DAQ's daq-dev cluster, in the tenant ngt-sakura, for `kubectl apply -k`:
# see README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The tenant's namespaces must start with its name, which its Capsule Tenant enforces.
namespace: ngt-sakura-airflow
resources:
  - ../onepod
  - ngt-airflow-daq-dev.yaml
images:
  # The Tenant only lets pods pull from harbor.cms and gitlab-registry.cern.ch.
  - name: ngt-airflow
    newName: harbor.cms/ngt-sakura/ngt-airflow  # the tenant's Harbor project: see README.md
    newTag: 3.3.1-7  # Airflow's version, then our build's: a new build needs a new tag
  # Harbor's cache of registry.cern.ch, which keeps Docker Hub's images under docker.io/.
  - name: postgres
    newName: harbor.cms/it-registry-proxy/docker.io/library/postgres
# As the cluster's policies and kubernetes-governance.md ask. Not includeSelectors: a Deployment's
# selector can't change once it exists.
labels:
  - includeTemplates: true
    pairs:
      app.kubernetes.io/name: ngt-airflow
      app.kubernetes.io/instance: ngt-airflow
      app.kubernetes.io/part-of: cms-daq
      app.kubernetes.io/env: development
      app.kubernetes.io/version: 3.3.1
      app.kubernetes.io/managed-by: kubectl
      cms.cern.ch/division: ngt-sakura
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ngt-airflow
      spec:
        template:
          spec:
            # The cluster's policies flag pods that run as the namespace's `default` one.
            serviceAccountName: ngt-airflow
            # Only needed if the Harbor project is private: see README.md. A missing Secret only
            # costs a warning in the pod's events.
            imagePullSecrets:
              - name: harbor-ngt-sakura
            containers:
              - name: airflow
                env:
                  # The Ingress terminates TLS, so the login's cookies can be for https only.
                  - name: AIRFLOW__FAB__ENABLE_PROXY_FIX
                    value: "True"
                  - name: AIRFLOW__FAB__COOKIE_SECURE
                    value: "True"
