# What ../values.yaml's chart doesn't deploy, for `kubectl apply -k` before `helm install`: see ../../README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ngt-airflow-extras.yaml
configMapGenerator:
  - name: ngt-airflow-scripts
    files:
      - init_multipod.sh
    options:
      # ../values.yaml names it, so no hash suffix: re-apply this, then restart the scheduler, after changing the script.
      disableNameSuffixHash: true
