# What Airflow's chart (1.22.0) can't be told through ../values.yaml, applied by post-render.sh to everything it renders.
# The first two are what policy engines' best practices ask for, e.g. daq-dev's Kyverno policies.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - chart.yaml
patches:
  # restrict-automount-sa-token: no API token, said by the pod itself, not only by its ServiceAccount as values.yaml has
  # it. The chart only writes this for a scheduler that starts pods.
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  # ensure-probes-different: the chart gives the API server the same HTTP check for liveness as for readiness. Alive is
  # answering at all.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ngt-api-server
      spec:
        template:
          spec:
            containers:
              - name: api-server
                livenessProbe:
                  httpGet: null
                  tcpSocket:
                    port: 8080
  # The chart makes this for Celery's broker whatever the executor. LocalExecutor never reads it.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Secret
      metadata:
        name: ngt-broker-url
  # With values-step-pods.yaml, which annotates it, the scheduler starts each step's pod, so it needs an API token. The
  # chart projects one only for an executor of its own that starts pods; this is the same volume. Without that file,
  # nothing matches and the scheduler has no token.
  - target:
      kind: Deployment
      name: ngt-scheduler
      annotationSelector: ngt-airflow/step-pods=true
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: kube-api-access
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
              - downwardAPI: {items: [{path: namespace, fieldRef: {apiVersion: v1, fieldPath: metadata.namespace}}]}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
