[pytest]
testpaths = tests
markers =
    scenario: slow end-to-end run of the live demo (needs bash, tmux and .venv); run with `pytest -m scenario`
    container: slow end-to-end runs of the Airflow container deployments (needs Docker); run with `pytest -m container`
    cmssw: one real file through every step with real CMSSW (needs a cmsenv'd shell and NGT_TEST_INPUT); run with `pytest -m cmssw`
addopts = -m "not scenario and not container and not cmssw"
