# Single run, single calibration.
runs:
  - calibrations: [EcalPedestals]
    run: 398600
    start_offset: 0
    minutes_ago: 2
    lumisections:
      - {ls: 51, after: 0}
      - {ls: 52, after: 20}
      - {ls: 53, after: 20}
    end_after: 30

# Step 4 re-harvests everything each cycle and uploads the final payload again when the run ends.
expect:
  settle_timeout: 600
  quiet_for: 45
  allow_duplicates: true
  allow_extra: {before: true, after: true}
  payloads:
    - {calibration: EcalPedestals, run: 398600, lumisections: 51-53}
