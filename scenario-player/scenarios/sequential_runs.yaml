# Two runs back to back: a fresh run latched right after the previous one
# finishes.
runs:
  - calibrations: [EcalPedestals, SiStripBad, BeamSpot]
    run: 700501
    start_offset: 0
    lumisections:
      - {ls: 1, after: 0}
      - {ls: 2, after: 15}
      - {ls: 3, after: 15}
      - {ls: 4, after: 15}
    end_after: 20

  - calibrations: [EcalPedestals, SiStripBad, BeamSpot]
    run: 700502
    start_offset: 70
    lumisections:
      - {ls: 1, after: 0}
      - {ls: 2, after: 15}
      - {ls: 3, after: 15}
      - {ls: 4, after: 15}
    end_after: 20

# Each run's chain runs in full, independently of the other's. Step 4 re-harvests everything
# each cycle and uploads the final payload again when the run ends.
expect:
  settle_timeout: 1200
  quiet_for: 60
  allow_duplicates: true
  allow_extra: {before: true, after: true}
  payloads:
    - {calibration: EcalPedestals, run: 700501, lumisections: 1-4}
    - {calibration: SiStripBad,    run: 700501, lumisections: 1-4}
    - {calibration: BeamSpot,      run: 700501, lumisections: 1-4}
    - {calibration: EcalPedestals, run: 700502, lumisections: 1-4}
    - {calibration: SiStripBad,    run: 700502, lumisections: 1-4}
    - {calibration: BeamSpot,      run: 700502, lumisections: 1-4}
